name: Full diagnostics

on:
  push:
    branches:
      - "diagnostics/**"
  workflow_dispatch:

jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.1.0 torchvision==0.16.0 torchaudio==2.0.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test dependencies
        shell: bash
        run: |
          python -m pip install -e . --no-deps
          python -m pip install coverage flake8 mypy pytest
          grep -Ev '^(torch|torchaudio|torchvision|torchtext|xformers)([<=>!~].*)?$' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Python bytecode compilation
        run: python -m compileall -q audiocraft tests
      - name: Lint and type checks
        run: make linter
      - name: Unit tests and coverage
        run: make tests
      - name: Integration tests (CPU)
        run: make tests_integ
